# The macOS build (Apple Silicon, MLX with Metal): qwenny and the mlx.metallib it loads from its own folder, as one
# .tar.gz. A tag v* publishes it as that tag's GitHub release; a manual run keeps it as the run's artifact.
name: macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # the oldest macOS the binary runs on (MLX needs 14 for its Metal features)
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # MLX's metallib into a known place, to ship beside the binary
      MLX_RS_METAL_PATH: ${{ github.workspace }}/metallib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Metal toolchain
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: cargo build --release --no-default-features
      - name: Package
        run: |
          name=qwenny-macos-arm64
          mkdir -p "dist/$name"
          cp target/release/qwenny "$MLX_RS_METAL_PATH/mlx.metallib" "dist/$name/"
          "dist/$name/qwenny" --help > /dev/null
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" | tee "$name.tar.gz.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      # the Metal kernels' tests, where the runner's virtual GPU allows them
      - name: Tests (Metal)
        continue-on-error: true
        run: cargo test --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.tar.gz*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes \
            "macOS on Apple Silicon (MLX, Metal), macOS 14 or later: unpack and keep \`mlx.metallib\` beside \`qwenny\`. See the README's \"MLX on Apple Silicon\"."
          gh release upload "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" --clobber
