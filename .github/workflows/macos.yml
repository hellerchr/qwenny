# The macOS build (Apple Silicon, MLX with Metal): qwenny and the mlx.metallib it loads from its own folder, as one
# .tar.gz. A tag v* publishes it as that tag's GitHub release; a manual run keeps it as the run's artifact.
name: macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # the oldest macOS the binary runs on (MLX needs 14 for its Metal features)
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # MLX's metallib into a known place, to ship beside the binary
      MLX_RS_METAL_PATH: ${{ github.workspace }}/metallib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # no build cache: a cached MLX build would skip making mlx.metallib, which ships beside the binary
      - name: Metal toolchain
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: cargo build --release --no-default-features
      # the unit tests, the Metal kernels' among them, on the runner's GPU
      - name: Tests
        run: cargo test --release --no-default-features
      - name: Package
        run: |
          name=qwenny-macos-arm64
          mkdir -p "dist/$name"
          cp target/release/qwenny "$MLX_RS_METAL_PATH/mlx.metallib" "dist/$name/"
          "dist/$name/qwenny" --help > /dev/null
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" | tee "$name.tar.gz.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      # as on a user's Mac: the build's metallib path gone, mlx.metallib only beside the binary (the test binary, whose
      # Metal kernel tests load it)
      - name: Metallib beside the binary
        run: |
          exe=$(cargo test --release --no-default-features --no-run --message-format=json \
                | jq -r 'select(.profile.test == true and .target.kind == ["bin"]) | .executable')
          mkdir colocated
          cp "$exe" colocated/qwenny-tests
          mv "$MLX_RS_METAL_PATH" "$MLX_RS_METAL_PATH.gone"
          # no metallib anywhere: the Metal tests must fail, else this check proves nothing
          if colocated/qwenny-tests mlx::metal > /dev/null 2>&1; then echo "the tests ran without a metallib"; exit 1; fi
          cp "dist/$NAME/mlx.metallib" colocated/
          colocated/qwenny-tests mlx::
          mv "$MLX_RS_METAL_PATH.gone" "$MLX_RS_METAL_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.tar.gz*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes \
            "macOS on Apple Silicon (MLX, Metal), macOS 14 or later: unpack and keep \`mlx.metallib\` beside \`qwenny\`. See the README's \"MLX on Apple Silicon\"."
          gh release upload "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" --clobber
