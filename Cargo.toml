[package]
name = "qwenny"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = 1

[features]
default = ["cuda"]
# hand-written CUDA kernels and cuBLAS (nvcc at build time; never on macOS)
cuda = ["dep:cudarc"]
# MLX on Linux, with MLX's CUDA backend (vendor/mlx-sys builds it; MLX_C_DIR reuses a build). On macOS MLX with
# Metal is always built in.
mlx = ["dep:mlx-rs"]

[dependencies]
anyhow = "1"
# the access database (auth.rs): admin password, API keys
argon2 = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
axum = "0.8"
# hand-written CUDA kernels (nvcc at build time) and cuBLAS
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cublas", "fallback-dynamic-loading", "cuda-version-from-build-system"] }
half = "2"
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
memmap2 = "0.9"
minijinja = { version = "3", features = ["json", "loop_controls", "preserve_order", "serde"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
safetensors = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
mlx-rs = { version = "0.32.0", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { version = "0.32.0", features = ["metal", "accelerate"] }

[patch.crates-io]
# mlx-sys with a Linux build path (MLX's CUDA backend) and x86 half types; macOS builds as upstream
mlx-sys = { path = "vendor/mlx-sys" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
